<!doctype html>
<!-- Control page: hand-built with one known violation per rule petals checks.
     Judged against ../brand-plotplot-v1.9.0 with --product petals. -->
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
<style>
  .off-palette { color: #3B82F6; }
  .low-contrast { color: #E8E8E8; background: #FAF5E9; }
  .other-accent { border-color: #98D98D; }
  .off-scale { padding: 13px; }
  @media (min-width: 700px) { .wide { display: block; } }
  .odd-radius { border-radius: 9px; }
  .thick { border: 3px solid #357E2C; }
  .made-up-shadow { box-shadow: 0 4px 12px rgba(58, 39, 24, 0.2); }
  .bouncy { transition: transform .3s cubic-bezier(.5, -0.5, .5, 1.5); }
  h2 { font-family: var(--pp-font-heading); }
</style>
</head>
<body>
<p>We supercharge the brand bible.</p>
<p>Petals reads the brand — every time.</p>
<p>Lorem ipsum, call 555-0100 or write to hi@example.com.</p>
<a href="#">Read more</a>
<footer>
  <div class="gf-plot"></div>
  <nav class="gf-garden" aria-label="the garden">
    <span style="--bloom:var(--pp-petals)" class="is-current"><span class="gf-dot"></span>petals</span>
  </nav>
</footer>
<!-- access/*: one source-level accessibility failure per rule -->
<meta name="viewport" content="width=device-width, user-scalable=no">
<style>.plain:focus { outline: none; }</style>
<img src="plot.png">
<input type="email" placeholder="Email">
<button type="button" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h16"/></svg></button>
<div onclick="go()">Go on</div>
<!-- reuse/rebuilt-component: a raw button where components/button.md covers it -->
<button type="button">Go</button>
</body>
</html>
