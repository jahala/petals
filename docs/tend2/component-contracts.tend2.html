# component-contracts: one home per component, and the check knows it
**Goal.** Every component has one home and a contract naming its states and tokens, and the check flags a component that was rebuilt instead of reused. Phase 5 of the roadmap.

- [ ] (code) A second definition of a contracted component outside its home is flagged (issue #7) · tests/reuse.spec.sh
