# Brand Distribution

**Goal.** /petals init --from <repo-url> connects a project to a central brand repository. /petals update syncs with new versions. Automatic drift detection warns when the central brand has moved ahead. Project overrides survive updates.

When the brand changes, every project has a fossilized copy. Three different brand versions exist across the org within months. New projects start by copy-pasting a colors.ts from another repo and hoping it's current. Distribution makes the brand as easy to get as git pull — one command, always current, never drifts silently.

Maria pushes the new brand to the central repo. Tags `v1.3.0`. Done.

Three days later, she opens a session on the dashboard project. Before she types a word, the agent reports: *Brand drift detected. Local: v1.2.0. Central: v1.3.0.* The dashboard has a seasonal campaign override — a gold palette for the holiday push. She runs `/petals update`. The primary color updates to the new teal. The gold palette stays. The heading font updates. Nothing breaks.

This is distribution: the brand travels, not a chat message.

## One command wires a project to the brand

`/petals init --from github.com/org/brand` pulls `.brand/` into the project. The agent reads it without being told. No hex codes in the prompt. No brand context pasted into the message. A developer joining the project — someone who has never heard of petals — opens a session, types "build a contact page," and the agent produces output in the correct palette, the correct font, the correct voice. They don't know why. They don't need to.

Under the hood, the fetch strategy selects itself. If git and SSH are available, a shallow clone grabs `.brand/` and nothing else — fast, authenticated, no token to manage. If only `GITHUB_TOKEN` is set, the API fetches the directory contents over HTTPS. If neither, and the repo is public, raw.githubusercontent.com delivers the files. Three strategies, zero configuration. Petals reads the environment and picks the one that works.

The result lands in `.brand/` — a cache, not source code. It is immediately gitignored. The project never commits the brand; it commits `.petalsrc`, which records the source URL, the version tag, and the override map. The brand lives in the central repo. The project knows where to find it.

## Drift is detected, not announced

When the central brand tags a new version, nobody Slacks anyone. Nobody files a ticket. Nobody pastes the hex codes into a shared document and hopes.

The next agent session on each connected project runs `/petals check` — a comparison of `.petalsrc`'s `version` field against the central repo's latest tag. The comparison costs one API call. If they match, nothing happens. If they differ, the agent reports the gap: both version numbers, the tag date, a summary of what changed. No noise when there is no drift. No silence when there is.

The brand operator never has to remember which projects are connected or what version they are on. The infrastructure remembers. The agent surfaces drift at the moment it matters — when someone is about to do work that should use the current brand.

## Overrides survive. Everything else updates.

Some projects need to diverge. A campaign page uses a seasonal palette for six weeks. An experimental feature tests a new type scale. A regional variant swaps the primary typeface for a CJK font.

`.petalsrc` records overrides as a flat map: `colors.primary: '#GOLD'`, `typography.heading: null`. When `/petals update` runs, explicitly set values survive — the gold stays gold. Null-inherited values update to the central's current — the heading font moves forward with the brand. The merge is deterministic, visible in `.petalsrc`, and reversible by clearing an override.

This is the critical distinction. Without it, overrides create frozen projects — the campaign page never gets the new primary color because updating would destroy the gold. With it, the project moves with the brand on everything it hasn't intentionally changed. The override map is the contract between what the project controls and what the brand controls.

## Connecting to a family

A central brand may carry products/. When a project connects, it declares which product it is — `.petalsrc` records `product: petals` alongside source and version — or none, to live on the umbrella alone. From then on the check, the book, and the tokens resolve against that context, updates carry both layers, and project overrides still win. One central family, each project knowing its own name.

## What an update owes you

An update that lands silently is half an update. After the merge applies and the version bumps, the workflow regenerates the machine views — tokens.css and tokens.json are derived artifacts, so they move with the markdown — and then reports the blast radius: every file the new brand version flags that the old one did not. "Updated to v1.3.0, three files now carry violations introduced by this update" is actionable; a silent sync that leaves the campaign page in last year's palette is how drift started in the first place. A clean update says so in one line.

## The loop closes

[Brand Extraction](brand-extraction.tend2.html) creates the intelligence layer once — a `.brand/` directory from a PDF, a design-tool export, a folder of assets. [Brand Check](brand-check.tend2.html) catches what slips through — hardcoded colors, wrong fonts, off-brand voice — before it reaches review.

Distribution sits between them. Extraction without distribution is a beautiful artifact that lives in one repo. Check without distribution catches drift on one project and leaves the other five oblivious. Distribution makes extraction useful beyond its birthplace and gives check something to verify against — a canonical source, kept current across every project where agents do work.

The central brand repo is just a git repository. `.brand/` at the root. Semantic version tags. Any project, any developer, any agent session — one command connects them to the same brand truth. No server. No database. No login page. Just files, git, and the skill that wires them together.

## Where

petals/scripts/fetch-brand.sh (HTTPS fetch or shallow clone logic). petals/SKILL.md (init --from and update subcommand surfaces). .petalsrc (generated per-project config: source, version, overrides).

## How

Two fetch strategies, auto-selected: HTTPS API fetch (uses GITHUB_TOKEN from env) or shallow git clone (when SSH access detected). Public repos use raw.githubusercontent.com. .brand/ is gitignored — a cache, not source code. .petalsrc records source, version, and optional overrides. Drift detection compares local version against central's latest tag. Overrides merge: set values win, null inherits from central. After applying an update: regenerate the derived machine views (tokens.css / tokens.json) and report the blast radius - files newly flagged under the new version, or an explicit clean line. Family brands: .petalsrc records the project's product context; fetch carries umbrella + layers.

## Fit

Distribution makes extraction useful beyond one project. Extraction creates the brand intelligence layer once. Distribution gets it everywhere. They share the .brand/ format contract — distribution works on any valid .brand/ regardless of how it was created.

## Impact

Six projects are connected. The central brand tags v1.3.0. Next agent session on each project detects the drift. Four update immediately. Two with campaign overrides update without losing their seasonal palette. Zero projects still silently using v1.2.0 two weeks later. A developer joining any project runs one command and their first agent session produces on-brand output.
