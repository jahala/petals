# Brand Book

**Goal.** A single self-contained HTML file (.brand/book.html) that renders the entire brand as a human-readable reference surface, generated from the canonical .brand/ source files.

The book gives the brand owner a reviewable, shareable artifact and serves as a copy-source for agents — every value rendered comes from the canonical .brand/ files.

## Maria finally sees what the agent sees

Extraction ran yesterday. Maria knows the agent read the deck and produced a directory of markdown — and she has never opened a markdown file in her life. She opens `.brand/book.html` instead. One page: the palette as swatches with names and measured contrast, the headline face actually set as a headline, the spacing scale drawn at true size, the components as they will really render, the voice rules with her own forbidden words listed. Twelve seconds in she points at the second swatch: "that's not our green." That sentence is the whole point — she could not have said it about a markdown table.

## One page, every value, nothing invented

The book is a view, not a second source of truth. Every section names the file it renders in its kicker — colors.md, typography.md, layout.md, components.md, voice.md, identity.md — and every value on the page comes from that file. Where extraction flagged a value instead of guessing it, the flag renders first, as a needs-an-answer card: the owner's review queue, before anything else. Regenerate with /petals book after any change; hand-editing the book is hand-editing a build artifact.

## The exemplars are the shortcut

The components section is built purely from the brand tokens — buttons, a card, a terminal pane, each carrying the real radius, the real shadow recipe, the real ease. That makes the book double as the agent's copy source: view source, take the markup, and the result is on-brand by construction. Rules tell an agent what not to do; the exemplars show it what to do.

## A product book with its family named

In a family brand the book renders the RESOLVED product brand — umbrella plus the product's layer — and says so: the masthead reads "petals brand book - a plotplot brand", and every section kicker names its owning layer (`colors.md - umbrella`, `products/petals/identity.md`). Maria sees one coherent brand and can still tell which decisions are the family's and which are the product's. A flat brand renders exactly as before, with no family ceremony.

## What the book refuses to be

It is not a builder, and not a place where values live. petals ships no build pipeline for it — the agent renders the book from the brand files on demand, following the structure contract in book-guide.md (the decision trail records the rejected generator binary). And the book must pass its own /petals check — palette-only hexes, exact families, and whatever casing, terminology, and voice rules the brand itself declares. The book carries the project's brand, never petals' own: chrome included, a Title Case brand gets a Title Case book. A brand book that is off-brand would be a confession.

## Where

.brand/book.html — one file, no dependencies beyond Google Fonts. Generated by /petals book from colors.md, typography.md, voice.md, identity.md, DESIGN.md, layout.md, components.md, and product layers.

## How

Agent-rendered from all .brand/ files in one pass (a rendering job, not an audit — the one workflow that loads everything). One section per brand file, every value sourced from its file, true-size demonstrations over descriptions, flags float to the top. The book must pass its own /petals check.

## Fit

Closes the review loop that extraction opens: init produces .brand/, the book renders it back for human sign-off, check enforces it. The book is also the exemplar source — the show-don't-tell layer the rules alone can't carry.

## Impact

Brand values are reviewable in a browser without reading markdown tables. The book carries generation metadata and a source fingerprint so staleness is self-evident.
