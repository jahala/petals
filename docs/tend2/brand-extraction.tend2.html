# Brand Extraction

**Goal.** /petals init <folder | url> reads brand assets using the agent's native capabilities and produces two things: a complete .brand/ directory of agent-readable brand files, and the SKILL.md that makes those files actionable at generation time — so agents read, apply, and enforce brand rules before any code or copy reaches human review. Accepts a local folder (PDFs, images, markdown, JSON, CSS) or a URL (website — extracts computed CSS values, font stacks, page copy, and assets via Playwright MCP and WebFetch).

The brand team's 40-page PDF is beautiful. It means nothing to an agent. Today, an agent opening a session picks the framework's default blue, uses Inter because it shipped with the template, and writes copy that sounds like every other SaaS landing page. The gap is twofold: the brand isn't agent-readable (no structured files), and even if it were, the agent doesn't know it exists or how to use it (no behavioral contract). Extraction solves both — it translates the brand into files agents can read, and wraps them in a skill that tells the agent when and how to use them.

## Maria opens the attachment. Six projects are still using the old blue.

The brand team's email lands at 9:47am. Attached: a 40-page PDF brand guide (v2.3), a folder of logo SVGs in six color variants, and a forwarded chat message from the design director: "Primary is #FF4D00 now, not #E7000B. Please update everywhere." Maria is the bridge between a beautiful PDF and an agent's empty context window. Four projects to update. Zero desire to manually type 47 hex codes, guess which weight of Raleway is the heading weight, or message every team with instructions they skim once and forget.

She drops the PDF, the SVGs, and the designer's README into a folder called `brand-assets/`. Then she runs one command:

```
/petals init brand-assets/
```

The agent reads each asset with its best native capability. Vision for the PDF. Direct parsing for the JSON palette the designer included. Natural-language reading for the voice guidelines in the README. Byte-for-byte copy for the SVGs. Two things appear in the project: a `.brand/` directory with five structured files, and a `SKILL.md` that tells every future agent session how to use them.

Maria opens `colors.md`. The primary field reads `#FF4D00`. Not `#E7000B`. She opens `typography.md`. Raleway Bold at 48px for headings, Open Sans Regular at 16px for body — verbatim from the PDF. She diffs the asset folder against the source: byte-identical. She commits. The next agent session in this project picks up the brand automatically. She never pasted a hex code.

## One command produces two things: the files and the contract.

Extraction is not a parser. It is not a scraper. It is a skill — a structured process the agent follows to read brand assets, synthesize the output, and flag ambiguity rather than paper over it.

The pipeline is five stages, not a parse-and-dump:

The `.brand/` directory is the intelligence layer. Five files: `DESIGN.md` (the full design system, following the open 9-section DESIGN.md format), `colors.md` (every explicit hex value with its semantic role), `typography.md` (font families, weights, sizes, and hierarchy), `voice.md` (tone rules, forbidden terms with before/after examples, copy patterns), and `identity.md` (brand name, tagline, and metadata — or "not specified" when the source is silent). An `assets/` subdirectory holds the original files, byte for byte.

`SKILL.md` is the behavioral contract. It auto-triggers when an agent opens a session with creative work on the stack. It instructs the agent to read the relevant `.brand/` files before generating any code or copy, and to apply those rules at generation time — not as a post-hoc lint pass. The agent treats the brand the way it treats a tsconfig: ambient infrastructure, present by default, correct without being asked.

## What extraction refuses to do.

Petals never infers a hex code from a color name. If the source says "Primary: Teal" without stating `#2F99A4`, extraction flags it as missing — not guessed, not approximated, not sampled from a swatch image. The same discipline applies to typography: "Body: Open Sans" without a weight prompts a flag asking for clarification. Voice guidelines without before/after examples get flagged. Extraction errs on the side of explicit over complete. A `.brand/` with three fully specified files and two flags that say "ask a human" is more useful than five files full of guesswork.

When the source folder is empty, extraction reports a clear error and produces nothing. When the folder has only images and no text-based brand spec, extraction populates `assets/` with the images and flags that colors, typography, and voice require explicit specification. When the source contains contradictory information — "Primary: #FF4D00" on page 3 and "Primary: #E7000B" on page 12 — extraction surfaces both values and asks which is current. Every edge case produces a clear signal. No silent approximation.

## Two views the machines read directly

The markdown is canonical, and markdown is prose — an agent applying a palette wants values, not paragraphs. Extraction therefore emits two derived views alongside the seven files: `tokens.css`, every brand value as a custom property ready to import, and `tokens.json` in the W3C design-tokens shape that build tools and theme configs consume directly. Both are generated, never authored; both regenerate on every /petals update. One honesty rule carries over from extraction itself: a flagged value is never tokenized — a generated view must not launder a guess into a value. For the human reading rather than building, the [brand book](brand-book.tend2.html) renders the same directory back as a single page.

## Families: shared truth up, deltas down

When the source material describes an organization with named products, extraction writes the shared truth to the umbrella files and each product's own facts — accent claim, mark, tagline, terminology — to `.brand/products/<product>/`. Deltas only; an absent file inherits the umbrella entirely. A single-brand source stays flat and never sees the structure. porto itself is the living case: plotplot is the umbrella, petals the product layer, and the seam between them is exactly where the mark and the tagline live.

## The brand that arrives before the first line of code.

The payoff is what does not happen. Nobody pastes a hex code into a prompt. Nobody types "Use Raleway for headings, not Inter" at the start of every session. Nobody catches the framework's default blue in PR review and leaves a comment for the fourth time this week. Nobody discovers three months later that the campaign landing page used the 2023 palette because that was the only colors.ts the agent found.

Extraction creates the layer that [Brand Distribution](brand-distribution.tend2.html) propagates across projects and [Brand Check](brand-check.tend2.html) audits against. Without extraction, there is nothing to distribute and nothing to check. With it, an agent given "build a contact page" — zero brand instructions in the prompt — produces output in the correct primary color, the correct heading font, the correct spacing scale, and the correct voice. `/petals check` on that output reports zero errors. The brand was ambient infrastructure: present, correct, and invisible.


## Where

petals/SKILL.md (auto-trigger conditions, hard validity rules, subcommand dispatch — the behavioral wrapper agents read). petals/references/extraction-guide.md (structured process for reading brand assets, incl. the derived machine views). petals/templates/ (DESIGN.md, colors.md, typography.md, voice.md, identity.md, components.md, layout.md — the output scaffolding). Emits .brand/tokens.css + .brand/tokens.json.

## How

The skill gives the agent a structured process, not extraction algorithms. For file-based sources, the agent scans the folder, reads each asset with its best native capability (vision for images, parsing for JSON/CSS, reading for markdown/PDF), synthesizes into the standard templates, copies asset files directly, and flags anything ambiguous. For website sources (§2a in extraction-guide.md), the agent navigates to the URL with Playwright MCP, reads computed CSS values via browser_evaluate (getComputedStyle), extracts rendered font stacks and page copy, downloads favicons and logo images, and flags every value as observed-usage rather than documented-brand. In both paths, color values must be explicit — either stated in source text or returned by the browser's layout engine. DESIGN.md follows the open 9-section DESIGN.md format. The SKILL.md auto-triggers on creative work and instructs agents to read .brand/ before generating and apply rules at generation time, not just check after. Family sources split into umbrella + product-layer deltas (extraction-guide 5a-pre).

## Fit

The entry point. Extraction creates the brand intelligence layer — the files, the skill, the behavioral contract. Distribution gets it into projects. Check audits against it. Without extraction, there's nothing to distribute and nothing to check against.

## Impact

An agent in a project with .brand/ and the petal skill, given "build a contact page" with zero brand instructions in the prompt, produces output using the correct primary color, heading font, spacing scale, and brand voice. /petals check on the output reports zero errors. Nobody pasted a hex code. The brand was ambient infrastructure — present, correct, and invisible.
