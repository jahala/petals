# Petals

**Goal.** Petals is the brand layer for AI coding agents. It's a skill that takes whatever a company already has — a 40-page brand PDF, a folder of logo SVGs, a color palette in JSON, a style guide in someone's head — and turns it into a clean, structured .brand/ directory that every agent in every project can read. Agents write UI and copy. Petals makes sure they write it on-brand. No new tools to learn. No servers to deploy. No databases to maintain. Just files.

Here's what happens today. An agent opens a session. Someone types "build a pricing page." The agent picks the framework's default blue — it has no reason not to. Uses Inter because that's what shipped with the template. Writes headline copy that sounds like every other SaaS landing page on the internet. Someone catches it in PR review. Someone else pastes the hex codes into the prompt next time. Everyone burns time and tokens on setup that should be invisible. And when the brand changes — new logo, palette refresh, voice shift — someone has to message every team and hope the old brand dies quietly. It never does. The brand team spent months on that identity. The PDF is beautiful. It means nothing to an agent.

## Maria opens her laptop at 9pm after the kids are down.

She has 90 minutes before she crashes. The brand team sent her a 40-page PDF yesterday — the new palette, the updated voice guide, the fresh logo variants. She's supposed to get this into six projects. Every agent in every project is still generating the old accent color. Nobody else on the team knows how to bridge the gap between a PDF and an agent's context window. She's the bridge.

She points petals at the folder. One command. The agent reads the PDF, extracts the hex codes, catalogs the font weights, copies the logo files, captures the voice rules. Five minutes later, `.brand/` exists — clean, structured, agent-readable. She pushes it to the central repo. Tags `v2.0.0`. Done.

Three days later, a developer on the dashboard project opens a session. Types "build a pricing page." The agent reads `.brand/` — no hex codes pasted into the prompt, no brand context in the message. The output uses the new primary color, the correct heading font, the new voice tone. The developer has never heard of petals. They don't need to.

This is the world petals builds. Brand as ambient infrastructure — present, correct, and invisible.

## The gap between the PDF and the prompt

Every modern engineering team has AI agents generating UI and copy. Every company has a brand — colors, fonts, voice, logos — defined in PDFs, design-tool libraries, and asset folders. These two things have never properly talked to each other.

Today, the interaction looks like this: an agent opens a session. Someone types a prompt. The agent picks the framework's default blue — it has no reason not to. Uses Inter because that's what shipped with the template. Writes headline copy that sounds like every other SaaS landing page on the internet. Someone catches it in PR review. Someone else pastes the hex codes into the prompt next time. Everyone burns tokens on setup that should be invisible.

When the brand changes — new logo, palette refresh, voice shift — someone Slacks every team. Some projects update. Some don't. Six months later, three different versions of the brand exist across the org's codebases. The brand team spent months on that identity. The PDF is beautiful. It means nothing to an agent.

Petals closes this gap. It translates the brand team's PDF into a `.brand/` directory that agents read natively. It wraps those files in a skill that tells the agent *when* to read them and *how* to apply them. And it distributes that intelligence across every project — automatically detecting drift, preserving project overrides, keeping one canonical brand wherever agents work.

## Three surfaces, one brand truth

The [brand extraction](brand-extraction.tend2.html) surface takes raw brand assets and produces structured intelligence. A 40-page PDF, a folder of SVGs, a JSON palette — the agent reads everything with its native capabilities (vision for images, parsing for structured data, reading for documents) and synthesizes it into a standard `.brand/` directory. DESIGN.md for the visual system. Colors, typography, voice, imagery — each as separate, focused files that agents can load progressively. No extraction algorithms. No browser automation. The agent already knows how to read a PDF. Petals gives it the structure.

Extraction hands back two derived views alongside the markdown — `tokens.css` and `tokens.json`, the same values shaped for build tools and theme configs — and the [brand book](brand-book.tend2.html) renders the whole directory back as a single page for the human who owns the brand: palette with measured contrast, type specimens, component exemplars an agent can copy verbatim, and every extraction flag waiting as a question at the top. The markdown stays canonical; the views are regenerated, never edited.

The [brand distribution](brand-distribution.tend2.html) surface gets that intelligence into every project that needs it. A central brand repo — a plain git repository with `.brand/` at its root — serves as the single source of truth. Projects connect with one command. Fetches happen over HTTPS or shallow clone, automatically selecting the right strategy based on what's available. `.brand/` is gitignored — a cache, not source code. When the brand updates, every project detects the drift on its next agent session. Project overrides survive updates. No chat messages. No manual config edits.

The [brand check](brand-check.tend2.html) surface closes the loop. Even the best agent misreads a file occasionally. Someone copies a component from a different project. A human edits agent output and introduces a hardcoded color. Check catches what slips through — before it reaches review. Colors against palette and contrast pairings. Fonts against hierarchy. Layout against scale. Surface against tokens. Forbidden terms against voice rules. Errors for violations that must be fixed; warnings for deviations close to the mark. Progressive disclosure: a color check loads `colors.md`, not the full DESIGN.md.

## One brand, many products

plotplot is an umbrella: petals, tend, tilth, and the products still seeds all carry the shared family brand — palette, type, layout, surface, voice — plus their own product layer in `.brand/products/<product>/`: one claimed accent, a mark, a tagline, product terminology. Deltas only; everything absent inherits. The book, the tokens, and the check operate on the resolved brand, and the check knows the boundaries: another product's accent in your UI is a warning by name. One family, legible seams.

## Files are the API

Petals doesn't have a server. It doesn't have a database. It doesn't have a login page or a billing system or a credit counter. It has files.

`.brand/` is a directory in the project root. Markdown for agents to read. JSON for tools to consume. Hard copies of brand assets for direct use. Any agent, any language, any tool can read it — because every tool already reads files.

Distribution is git. The central brand repo is just a repository with a `.brand/` directory and version tags. Projects pull from it. Git is already authenticated, already versioned, already understood by every developer. Petals doesn't need to reinvent distribution — it just needs to connect projects to the source and surface drift when it happens.

The skill is a Claude Code skill directory — `SKILL.md` for the activation surface, `references/` for the detailed guides, `templates/` for the output scaffolding. Progressive disclosure keeps the context cost minimal: ~100 tokens when idle (just the name and description in the agent's skill registry), ~2,500 when activated (the full SKILL.md body), and references loaded on demand for specific tasks like extraction or audit.

## What petals is not

Petals is not an image generator. It doesn't produce marketing assets or generate social media graphics. It provides the brand context that generators need — the colors, the fonts, the voice rules. The generation is someone else's job.

Petals is not a real-time firewall. It doesn't block every keystroke. It's context before work starts (the agent reads `.brand/` passively) and checkpoints at natural boundaries (the agent runs `/petals check` before marking work ready for review). Context keeps the agent on-brand at generation time. Check catches what slips through. Together, they're the steering wheel and the seatbelt — prevention and detection, not just one or the other.

Petals is not a SaaS platform. No login, no billing, no uptime dependency. Files in a repo. Self-hosted by definition. The brand team controls the central repo. Developers control their projects. Git handles the plumbing.

Petals does not infer colors from visual samples. If the brand guide says "primary: teal" without stating `#2F99A4`, petals flags it. LLMs make confident color approximations that are often ±1 in hex — close enough to look right, wrong enough to corrupt the brand over time. Explicit only. Missing values get flagged, not guessed.

## Where

Petals lives as a Claude Code skill directory — SKILL.md for the activation surface, references/ for the detailed extraction and audit guides, templates/ for the .brand/ output scaffolding, scripts/ for deterministic operations like fetching from the central repo. Its output is .brand/ in the project root: markdown files for agents to read, JSON for tools to consume, hard copies of brand assets for direct use. .brand/ is gitignored — it's a cache, not source code. The canonical brand lives in a central git repo. Projects pull from it. Petals connects them.

## How

The core insight is that the agent already knows how to read a PDF. It already knows how to look at an image and describe the logo, extract the color swatch, identify the font. Petals doesn't build extraction algorithms. It gives the agent a structured process: scan the folder, read each asset with the best available capability — vision for images, parsing for JSON, reading for markdown — synthesize everything into the standard .brand/ format, and flag anything ambiguous for human confirmation. The output format is DESIGN.md — an open design-system format used by dozens of brands — extended with supporting files for voice, imagery, and components that DESIGN.md doesn't cover. Distribution is git: a central brand repo tagged with versions, projects fetching over HTTPS or shallow clone. No push, no webhook — next time an agent works, it notices the drift. Files are the API.

## Fit

Petals sits at the intersection of two things that have never properly talked to each other: brand identity — visual systems, voice guidelines, asset libraries — and AI coding agents, the tools now generating most UI and copy in modern teams. The design-tool ecosystem has spent decades making brand human-readable. The AI ecosystem needs it machine-readable. Petals is the bridge — a single translation step, file-based so it works with any agent, open-source so it's inspectable and extensible, and progressive in its context loading so it adds negligible cost when idle and exactly the right information when active.

## Impact

When this works, brand becomes ambient infrastructure. A developer opens a project they've never seen, types "build a contact page," and the agent produces output in the right colors, the right fonts, the right voice. Nobody pasted a hex code. Nobody burned tokens on setup. PR reviews stop catching color mismatches and start catching real problems. When the brand updates, projects detect the drift on their next agent session — no chat messages, no manual config edits, no fossilized old palettes living in forgotten repos. The brand team's PDF finally reaches the code.
