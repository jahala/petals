# generic-look-pack: the check knows the generic AI look
**Goal.** A rule pack flags the generic AI look in source (gradient text, card in card, transition: all, filler copy, placeholders, invented facts) with a tell and a fix per finding, and an installer runs the check on every edit. Phase 6 of the roadmap.

## Tests
- [ ] (code) Each rule has an id, a tell and a fix, and one fixture per rule fails while its clean twin passes (issue #9) · tests/generic-look.spec.sh
- [ ] (code) A brand can switch any rule off in its own files (issue #9) · tests/generic-look.spec.sh
- [ ] (code) The hook installer runs the check on every edited UI file and removes itself cleanly on uninstall (issue #10) · tests/hook-install.spec.sh
