# Context Waste

**Pain.** The agent's context window holds ~200K tokens. The task needs most of them. Loading full brand guidelines burns 5,000-15,000 tokens before the work starts — adding latency, cost, and eating budget that should go to the task. Claude Skills proved progressive disclosure works: ~100 tokens at discovery, ~2,500 at activation, references on demand. But no brand tool implements it. They all dump the full spec into context. The agent pays for brand rules it never uses while the task starves for tokens.

## The agent loads 2,500 tokens of brand context. The task gets the rest of the 200K window.

The agent opens a session. The task is a multi-screen feature: auth flow, onboarding, dashboard. The prompt alone is substantial. Every token counts. Before petals, loading brand context meant either skipping it (and generating generic UI) or dumping the full 15,000-token brand guidelines into context — eating 7.5% of the budget before the task even starts.

With petals, the agent discovers the skill at ~100 tokens. When creative work activates, it loads SKILL.md at ~2,500 tokens. It reads `colors.md` for the palette — just that file, nothing else. Voice and typography stay on disk until copy or UI work needs them. Total brand context: under 3,000 tokens. The rest goes to the task. The agent produces on-brand output without the brand consuming the budget.

That's progressive disclosure working. The agent loads what it needs when it needs it, not the entire brand spec on every session. The cost of brand compliance is proportional to the creative surface area, not to the size of the brand spec.

## The agent's cost model is the design constraint

We're betting that token cost drives agent behavior more reliably than any instruction we write. If brand context costs 15,000 tokens, the agent skips it. If it costs 3,000, the agent loads it. The entire architecture — separate markdown files, progressive disclosure, SKILL.md tiering — is designed around this bet.

The risk: we're wrong about the threshold. Maybe 3,000 tokens is still too expensive for a budget-constrained agent, and the real threshold is 1,000. Or maybe the threshold isn't about token count at all — it's about latency, or context switching cost, or the agent's internal prioritization of instructions over files. We don't have data on what actually drives agent loading behavior because nobody has instrumented it.

Additional risk: our progressive disclosure model assumes three tiers (discovery → activation → on-demand), but the agent might treat all three as one load event. If the agent reads SKILL.md and immediately follows every reference to `colors.md`, `typography.md`, and `voice.md` — loading all 15,000 tokens despite our tiered design — progressive disclosure is theater. The files are separate but the agent reads them sequentially in one pass.

## 2-3 focused files outperform one monolithic spec. Nobody applied this to brand.

Agents perform better with smaller, focused context files than with comprehensive single documents. The improvement is 18.8 percentage points on task success. The mechanism is straightforward: less context means less noise, which means better attention to the relevant rules.

Claude Skills built progressive disclosure into their architecture based on this finding — ~100 tokens at discovery, ~2,500 at activation, references on demand. It works for code generation, data analysis, document processing — every domain where agents need structured guidance.

But no brand tool implements it. The brand tools we reviewed all dump the full brand spec into context. Some of them recognize the problem (one ships a `brand-runtime.json` is explicitly designed to be "compact") but none of them implement tiered loading. The Claude Skills pattern exists, it's proven in other domains, and it's directly applicable to brand context. Nobody has connected those dots. Petals does.
