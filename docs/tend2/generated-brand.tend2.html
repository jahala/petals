# generated-brand: a project with no brand gets one
**Goal.** When a project has no brand, petals invents one: a short interview, three directions generated from the brief for the owner to choose from, a mark and a wordmark, then normal .brand/ files with every generated value marked. From then on it is the brand like any other. Phase 5 of the roadmap.

## Tests
- [ ] (code) /petals init --new asks at most three questions a round and records an unanswered one as undecided (issue #5) · tests/init-new.spec.sh
- [x] (code) Every generated direction passes the contrast pairs in both light and dark (issue #5) · tests/directions.spec.sh @8aa87941899427 · by cli
- [x] (code) Three directions too alike, or too close to a recent project in the history file, are refused with the reason (issue #5) · tests/directions.spec.sh @0b4390e1899427 · by cli
- [x] (code) An exact seed comes back unchanged and a seed too light for words gets a primary-text shade named in the receipt; a bounded seed moves no further than its stated distance; the roles a person must tell apart stay at least the stated CIEDE2000 distance apart in both themes; the same request prints the same bytes (issue #5) · tests/directions.spec.sh @f7801381899427 · by cli
- [x] (code) The generator's contrast and colour-distance answers equal check.sh's on every generated direction, so no brand is written that its own check fails (issue #5) · tests/directions.spec.sh @37fe9cb1899427 · by cli
