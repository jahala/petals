# stem-bed: petals judges every commit and pull request through the stem
**Goal.** petals is a planted bed under the plotplot stem, so every planted repository gets the brand check in the same hooks and the same pull request check as weeder, with no CI gate of its own. Phase 3 of the roadmap.

## Tests

- [x] (code) The release artifact is one deterministic tarball whose only member is a self-contained petals executable, with its sha256; that file copied alone runs and judges a change (issue #4) · tests/release.spec.sh · reads: scripts/build-release.sh, petals/bin/petals, petals/scripts/ @c4262079a7ef95 · by cli
- [x] (code) A clear-cut finding blocks, the rest warn, and an allow trailer with a reason turns a block into a recorded note (issue #4) · tests/allow-trailer.spec.sh · reads: petals/bin/petals, petals/scripts/check.sh, test/fixtures/brand-plotplot-v1.9.0/ @8a77eab822fa57 · by cli
